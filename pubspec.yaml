name: hcp_profiling
description: A Flutter app for HCP Profiling (HCP App) interfacing with ERPNext v15.
version: 0.6.5+42

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.5
  http: ^1.1.0
  provider: ^6.0.5
  intl: ^0.18.1
  geolocator: ^10.1.0
  image_picker: ^1.0.4
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  shared_preferences: ^2.2.2
  local_auth: ^2.1.8
  path_provider: ^2.1.1
  sqflite: ^2.3.0
  path: ^1.8.3
  url_launcher: ^6.2.0
  flutter_plugin_android_lifecycle: ^2.0.35
  local_auth_android: ^1.0.56
  path_provider_android: ^2.3.1
  shared_preferences_android: ^2.4.28
  url_launcher_android: ^6.3.33
  flutter_secure_storage: ^11.2.0
  flutter_local_notifications: ^17.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.1
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon-512.png"

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/app_logo.png
    - assets/app_logo_transparent.png
    - assets/icon-192.png
    - assets/icon-512.png
    - assets/medical_bg.jpg
    - assets/institutions.json
    - assets/specializations.json
    - assets/hcp_types.json
    - assets/data/
    - assets/data/psgc_locations.json
    - assets/web/
    - assets/web/territory_reconfiguration_portal.html

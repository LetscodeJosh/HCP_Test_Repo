# ==============================================================================
# PIMS HCP PROFILING APP - ENTERPRISE HIGH-AVAILABILITY LOAD BALANCER
# Reverse Proxy, L7 Traffic Distribution, SSL/TLS 1.3, Rate Limiting & Anti-DDoS
# ==============================================================================

user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;
pid /var/run/nginx.pid;

events {
    worker_connections 8192;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Performance Tuning
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 1000;
    types_hash_max_size 2048;
    server_tokens off;

    # Client Request Limits (Prevent Buffer Overflows & Large Payload Attacks)
    client_max_body_size 25M;
    client_body_buffer_size 128k;
    client_header_buffer_size 4k;
    large_client_header_buffers 4 16k;

    # --------------------------------------------------------------------------
    # 3.8 FLASH CYBER-GRADE SECURITY: RATE LIMITING & DDOS MITIGATION ZONES
    # --------------------------------------------------------------------------
    # Zone 1: General API requests (120 req/min with burst of 30)
    limit_req_zone $binary_remote_addr zone=api_general_limit:20m rate=120r/m;

    # Zone 2: Strict Authentication requests (10 req/min with burst of 5)
    limit_req_zone $binary_remote_addr zone=auth_strict_limit:10m rate=10r/m;

    # Zone 3: Search & Masterlist query rate limiting (60 req/min with burst of 20)
    limit_req_zone $binary_remote_addr zone=search_query_limit:20m rate=60r/m;

    # Connection Concurrency Limit (Max 50 active TCP connections per remote IP)
    limit_conn_zone $binary_remote_addr zone=per_ip_conn_limit:20m;
    limit_conn per_ip_conn_limit 50;

    # Custom Rate-Limit Response
    limit_req_status 429;
    limit_conn_status 429;

    # --------------------------------------------------------------------------
    # LOGGING WITH AUTOMATED SENSITIVE DATA REDACTION
    # --------------------------------------------------------------------------
    log_format cyber_secure '$remote_addr - $remote_user [$time_local] '
                           '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                           '"$http_referer" "$http_user_agent" '
                           'rt=$request_time uct="$upstream_connect_time" uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/hcp_access.log cyber_secure buffer=32k flush=5s;
    error_log /var/log/nginx/hcp_error.log warn;

    # GZIP Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # --------------------------------------------------------------------------
    # UPSTREAM APPLICATION CLUSTER (HEALTHY BACKEND APP SERVERS)
    # --------------------------------------------------------------------------
    upstream frappe_app_cluster {
        # Least Connections algorithm distributes load to the least busy server
        least_conn;

        # Healthy application server pool with passive health checks
        server frappe_app_1:8000 max_fails=3 fail_timeout=10s weight=10;
        server frappe_app_2:8000 max_fails=3 fail_timeout=10s weight=10;
        server frappe_app_3:8000 max_fails=3 fail_timeout=10s weight=10;

        # Standby warm-backup node activated automatically during peak spikes
        server frappe_app_standby:8000 backup;

        # Maintain persistent connection pool to backend workers
        keepalive 64;
    }

    # Upstream Cyber-Security Gateway (HMAC verification, WAF sanitization)
    upstream cyber_security_gateway {
        server security_gateway:9000;
        keepalive 32;
    }

    # --------------------------------------------------------------------------
    # HTTP REDIRECT TO SECURE HTTPS (ZERO UNENCRYPTED TRAFFIC)
    # --------------------------------------------------------------------------
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name pmii-marketing.com dev.pmii-marketing.com;

        # Let's Encrypt ACME Challenge verification
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Force all other traffic to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # --------------------------------------------------------------------------
    # SECURE HTTPS VIRTUAL HOST
    # --------------------------------------------------------------------------
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name pmii-marketing.com dev.pmii-marketing.com;

        # SSL/TLS 1.3 Cyber-Grade Encryption
        ssl_certificate /etc/letsencrypt/live/pmii-marketing.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/pmii-marketing.com/privkey.pem;
        ssl_protocols TLSv1.3 TLSv1.2;
        ssl_prefer_server_ciphers off;
        ssl_ciphers "ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256";
        ssl_session_cache shared:SSL:50m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # OCSP Stapling (Fast SSL Handshakes)
        ssl_stapling on;
        ssl_stapling_verify on;
        resolver 1.1.1.1 8.8.8.8 valid=300s;
        resolver_timeout 5s;

        # ----------------------------------------------------------------------
        # DEFENSIVE HTTP RESPONSE HEADERS (CYBER INTEGRITY SHIELD)
        # ----------------------------------------------------------------------
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

        # Proxy Header Propagation
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Buffer Tuning for Enterprise Payloads
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
        proxy_connect_timeout 5s;
        proxy_send_timeout 15s;
        proxy_read_timeout 15s;

        # ----------------------------------------------------------------------
        # LOCATION 1: FRACTIONAL HEALTH CHECK (Ping Endpoint)
        # ----------------------------------------------------------------------
        location = /api/method/ping {
            access_log off;
            proxy_pass http://frappe_app_cluster;
            proxy_next_upstream error timeout http_502 http_503 http_504;
        }

        # ----------------------------------------------------------------------
        # LOCATION 2: AUTHENTICATION (Brute Force & Credential Stuffing Shield)
        # ----------------------------------------------------------------------
        location = /api/method/login {
            limit_req zone=auth_strict_limit burst=5 nodelay;
            proxy_pass http://frappe_app_cluster;
            proxy_next_upstream error timeout http_502 http_503;
        }

        # ----------------------------------------------------------------------
        # LOCATION 3: SEARCH & DIRECTORY READS (Mitigate Database Bottleneck)
        # ----------------------------------------------------------------------
        location ~ ^/api/resource/(HCP|HCP%20Account|Institution|PSGC|Territory) {
            limit_req zone=search_query_limit burst=20 nodelay;

            # Enable Micro-Caching for high-frequency reads (serves from memory)
            proxy_pass http://frappe_app_cluster;
            proxy_next_upstream error timeout http_500 http_502 http_503 http_504;
        }

        # ----------------------------------------------------------------------
        # LOCATION 4: MUTATING PROFILING WRITES (Cryptographic Verification)
        # Routes through Cyber-Security Gateway before hitting Frappe
        # ----------------------------------------------------------------------
        location ~ ^/api/resource/HCP%20Profile%20Submission {
            limit_req zone=api_general_limit burst=20 nodelay;

            # Send to Security Gateway for HMAC and anti-replay verification
            proxy_pass http://cyber_security_gateway;
        }

        # ----------------------------------------------------------------------
        # LOCATION 5: GENERAL DEFAULT API ROUTING
        # ----------------------------------------------------------------------
        location / {
            limit_req zone=api_general_limit burst=30 nodelay;
            proxy_pass http://frappe_app_cluster;
            proxy_next_upstream error timeout http_502 http_503 http_504;
        }
    }
}
